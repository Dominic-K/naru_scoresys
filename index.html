<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>배드민턴 전광판 Pro</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { background-color: #000; color: #fff; font-family: 'Pretendard', 'Arial', sans-serif; height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* 1. 설정 화면 */
        #setupScreen { display: flex; flex-direction: column; height: 100%; background-color: #2e7d32; padding: 20px; overflow-y: auto; }
        .setup-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-shrink: 0; }
        .court-title { font-size: 1.5rem; font-weight: bold; }
        .btn-fullscreen-toggle { background-color: #111; color: #fff; border: 2px solid #fff; padding: 8px 15px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.9rem; }
        .btn-fullscreen-toggle:active { background-color: #333; }
        .court-layout { flex: 1; display: flex; border: 4px solid #fff; position: relative; margin-bottom: 20px; min-height: 200px; }
        .court-half { flex: 1; display: flex; flex-direction: column; border-right: 2px solid #fff; }
        .court-half:last-child { border-right: none; }
        .court-box { flex: 1; border-bottom: 2px solid #fff; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 10px; }
        .court-box:last-child { border-bottom: none; }
        input[type="text"] { width: 90%; padding: 12px; font-size: 1.1rem; text-align: center; border-radius: 5px; border: none; margin-bottom: 8px; color: #000; }
        .radio-label { font-size: 1rem; background: rgba(0,0,0,0.5); padding: 8px 12px; border-radius: 5px; cursor: pointer; }
        .start-game-btn { background-color: #ffca28; color: #000; font-size: 1.5rem; padding: 18px; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; margin-top: auto; flex-shrink: 0; margin-bottom: 20px; }
        
        /* 2. 전광판 화면 컨테이너 (스크롤 허용) */
        #mainBoard { display: none; flex-direction: column; height: 100%; overflow-y: auto; overflow-x: hidden; scroll-behavior: smooth; }
        
        .scoreboard { display: flex; width: 100%; min-height: 100vh; min-height: 100dvh; flex-shrink: 0; position: relative; }
        .team { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; background-color: #000; transition: 0.2s ease; border-right: 2px solid #222; }
        .team.has-serve { background-color: #1a365d; }
        .team:active { opacity: 0.7; }
        .score { font-size: 35vmin; font-weight: 900; line-height: 1; pointer-events: none; margin-bottom: 15vmin; }
        .team-left .score { color: #00ff00; } 
        .team-right .score { color: #ffff00; } 

        /* 3. 리얼 배드민턴 코트 디테일 */
        .combined-court {
            position: absolute; bottom: 8%; left: 50%; transform: translateX(-50%);
            display: flex; width: 90vmin; height: 26vmin; border: 3px solid #fff; 
            background-color: #2e7d32; pointer-events: none; z-index: 10;
            box-shadow: 0 10px 20px rgba(0,0,0,0.7); overflow: hidden;
        }
        .court-lines-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
        .inner-bounds { position: absolute; top: 12%; bottom: 12%; left: 7%; right: 7%; border: 2px solid rgba(255,255,255,0.4); }
        .short-service-bounds { position: absolute; top: 0; bottom: 0; left: 35%; right: 35%; border-left: 2px solid rgba(255,255,255,0.4); border-right: 2px solid rgba(255,255,255,0.4); }
        .center-line-left { position: absolute; top: 50%; left: 0%; width: 35%; border-top: 2px solid rgba(255,255,255,0.4); transform: translateY(-50%); }
        .center-line-right { position: absolute; top: 50%; right: 0%; width: 35%; border-top: 2px solid rgba(255,255,255,0.4); transform: translateY(-50%); }
        .court-net {
            position: absolute; top: -5%; bottom: -5%; left: 50%; width: 1.5vmin; transform: translateX(-50%);
            background: repeating-linear-gradient(45deg, rgba(255,255,255,0.9), rgba(255,255,255,0.9) 3px, #222 3px, #222 6px);
            border-left: 2px solid #fff; border-right: 2px solid #fff; box-shadow: 0 5px 15px rgba(0,0,0,0.6); z-index: 5;
        }

        /* 4. 서브 화살표 애니메이션 레이어 */
        .serve-arrow-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 8; }
        .shuttle-arrow { position: absolute; width: 4vmin; height: 4vmin; font-size: 4vmin; color: yellow; text-shadow: 0 0 10px yellow; opacity: 0; }
        
        @keyframes fly-left-top-to-right-bottom { 0% { top: 20%; left: 20%; opacity: 1; transform: translate(-50%, -50%) rotate(30deg); } 80% { top: 80%; left: 80%; opacity: 1; transform: translate(-50%, -50%) rotate(30deg); } 100% { top: 80%; left: 80%; opacity: 0; transform: translate(-50%, -50%) rotate(30deg); } }
        @keyframes fly-left-bottom-to-right-top { 0% { top: 80%; left: 20%; opacity: 1; transform: translate(-50%, -50%) rotate(-30deg); } 80% { top: 20%; left: 80%; opacity: 1; transform: translate(-50%, -50%) rotate(-30deg); } 100% { top: 20%; left: 80%; opacity: 0; transform: translate(-50%, -50%) rotate(-30deg); } }
        @keyframes fly-right-top-to-left-bottom { 0% { top: 20%; left: 80%; opacity: 1; transform: translate(-50%, -50%) rotate(150deg); } 80% { top: 80%; left: 20%; opacity: 1; transform: translate(-50%, -50%) rotate(150deg); } 100% { top: 80%; left: 20%; opacity: 0; transform: translate(-50%, -50%) rotate(150deg); } }
        @keyframes fly-right-bottom-to-left-top { 0% { top: 80%; left: 80%; opacity: 1; transform: translate(-50%, -50%) rotate(-150deg); } 80% { top: 20%; left: 20%; opacity: 1; transform: translate(-50%, -50%) rotate(-150deg); } 100% { top: 20%; left: 20%; opacity: 0; transform: translate(-50%, -50%) rotate(-150deg); } }
        
        .anim-lt-rb { animation: fly-left-top-to-right-bottom 1.5s infinite; }
        .anim-lb-rt { animation: fly-left-bottom-to-right-top 1.5s infinite; }
        .anim-rt-lb { animation: fly-right-top-to-left-bottom 1.5s infinite; }
        .anim-rb-lt { animation: fly-right-bottom-to-left-top 1.5s infinite; }

        /* 선수 토큰(UI) 레이어 */
        .court-half-ui { flex: 1; display: flex; flex-direction: column; z-index: 10; }
        .mc-box-ui { flex: 1; display: flex; justify-content: center; align-items: center; }
        .mc-name { font-size: 3.5vmin; font-weight: bold; color: #fff; padding: 6px 16px; border-radius: 30px; border: 3px solid transparent; transition: 0.3s; background-color: rgba(0, 0, 0, 0.4); text-shadow: 1px 1px 2px #000; }
        .mc-name.is-server { border-color: #ffca28; background-color: rgba(255, 202, 40, 0.9); color: #000; text-shadow: none; box-shadow: 0 0 10px rgba(255, 202, 40, 0.6); }

        /* 5. 하단 스크롤 메뉴 (그리드) */
        #scrollMenu { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 20px 15px 80px 15px; background-color: #111; border-top: 2px solid #333; flex-shrink: 0; }
        #scrollMenu button { padding: 22px 0; font-size: 1.2rem; border-radius: 12px; cursor: pointer; font-weight: bold; border: none; color: #fff; }
        .btn-change { background-color: #ffa726; color: #000 !important; }
        .btn-fullscreen-menu { background-color: #4CAF50; }
        .btn-undo { background-color: #ff5252; }
        .btn-reset { background-color: #9e9e9e; color: #000 !important; }
    </style>
</head>
<body>

    <div id="setupScreen">
        <div class="setup-header">
            <div class="court-title">선수 배치</div>
            <button class="btn-fullscreen-toggle" onclick="enterFullScreen()">⛶ 전체화면 켜기</button>
        </div>
        <div class="court-layout">
            <div class="court-half">
                <div class="court-box">
                    <input type="text" id="leftLeftPlayer" placeholder="왼팀 상단">
                    <label class="radio-label"><input type="radio" name="firstServe" value="left-left"> 서브</label>
                </div>
                <div class="court-box">
                    <input type="text" id="leftRightPlayer" placeholder="왼팀 하단">
                    <label class="radio-label"><input type="radio" name="firstServe" value="left-right" checked> 서브</label>
                </div>
            </div>
            <div class="court-half">
                <div class="court-box">
                    <input type="text" id="rightRightPlayer" placeholder="오른팀 상단">
                    <label class="radio-label"><input type="radio" name="firstServe" value="right-right"> 서브</label>
                </div>
                <div class="court-box">
                    <input type="text" id="rightLeftPlayer" placeholder="오른팀 하단">
                    <label class="radio-label"><input type="radio" name="firstServe" value="right-left"> 서브</label>
                </div>
            </div>
        </div>
        <button class="start-game-btn" onclick="initGame()">게임 시작</button>
    </div>

    <div id="mainBoard">
        <div class="scoreboard">
            <div class="team team-left" id="areaLeft" onclick="addScore('left')">
                <div class="score" id="scoreLeft">0</div>
            </div>
            <div class="team team-right" id="areaRight" onclick="addScore('right')">
                <div class="score" id="scoreRight">0</div>
            </div>

            <div class="combined-court">
                <div class="court-lines-layer">
                    <div class="inner-bounds"></div>
                    <div class="short-service-bounds"></div>
                    <div class="center-line-left"></div>
                    <div class="center-line-right"></div>
                    <div class="court-net"></div>
                </div>

                <div class="serve-arrow-layer">
                    <div id="shuttleArrow" class="shuttle-arrow">➤</div>
                </div>

                <div class="court-half-ui">
                    <div class="mc-box-ui"><span class="mc-name" id="name-left-top"></span></div>
                    <div class="mc-box-ui"><span class="mc-name" id="name-left-bottom"></span></div>
                </div>
                <div class="court-half-ui">
                    <div class="mc-box-ui"><span class="mc-name" id="name-right-top"></span></div>
                    <div class="mc-box-ui"><span class="mc-name" id="name-right-bottom"></span></div>
                </div>
            </div>
        </div>

        <div id="scrollMenu">
            <button class="btn-change" onclick="swapCourt()">코트 변경</button>
            <button class="btn-fullscreen-menu" onclick="enterFullScreen()">⛶ 전체화면 복구</button>
            <button class="btn-undo" onclick="undoScore()">실행 취소</button>
            <button class="btn-reset" onclick="resetGame()">전체 초기화</button>
        </div>
    </div>

    <audio id="silentAudio" loop playsinline><source src="data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA" type="audio/wav"></audio>

    <script>
        let state = { scoreLeft: 0, scoreRight: 0, servingTeam: '', currentServerSide: '', isContinuous: false, currentServerName: '', leftTeam: { right: '', left: '' }, rightTeam: { right: '', left: '' } };
        let historyStack = []; let isSystemStarted = false; let audioCtx; let voices = []; let wakeLock = null;

        window.speechSynthesis.onvoiceschanged = () => { voices = window.speechSynthesis.getVoices(); };

        function enterFullScreen() {
            let elem = document.documentElement;
            if (elem.requestFullscreen) { elem.requestFullscreen().catch(e=>console.log(e)); } 
            else if (elem.webkitRequestFullscreen) { elem.webkitRequestFullscreen().catch(e=>console.log(e)); } 
            if(isSystemStarted) document.getElementById('mainBoard').scrollTo(0, 0);
        }

        async function initGame() {
            document.activeElement.blur();
            enterFullScreen(); 

            state.leftTeam.left = document.getElementById('leftLeftPlayer').value || "왼쪽 1";
            state.leftTeam.right = document.getElementById('leftRightPlayer').value || "왼쪽 2";
            state.rightTeam.right = document.getElementById('rightRightPlayer').value || "오른쪽 1";
            state.rightTeam.left = document.getElementById('rightLeftPlayer').value || "오른쪽 2";

            const firstServe = document.querySelector('input[name="firstServe"]:checked').value;
            const [team, position] = firstServe.split('-');
            
            state.servingTeam = team; state.currentServerSide = position; state.currentServerName = state[team + "Team"][position];
            
            document.getElementById('setupScreen').style.display = 'none';
            document.getElementById('mainBoard').style.display = 'flex';
            
            isSystemStarted = true;
            updateUI();
            document.getElementById('mainBoard').scrollTo(0, 0);

            try {
                const audio = document.getElementById('silentAudio'); audio.play().catch(e=>console.log(e));
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!audioCtx) audioCtx = new AudioContext();
                if (audioCtx.state === 'suspended') await audioCtx.resume();
                const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                gain.gain.value = 0.0001; osc.connect(gain); gain.connect(audioCtx.destination); osc.start();
                if (navigator.wakeLock) wakeLock = await navigator.wakeLock.request('screen');
                speakTTS("시작");
            } catch (err) { console.log(err); }
        }

        function resetGame() {
            if(confirm("초기화 하시겠습니까?")) {
                if(document.exitFullscreen) document.exitFullscreen().catch(e=>console.log(e));
                state = { scoreLeft: 0, scoreRight: 0, servingTeam: '', currentServerSide: '', isContinuous: false, currentServerName: '', leftTeam: { right: '', left: '' }, rightTeam: { right: '', left: '' } };
                historyStack = []; isSystemStarted = false;
                document.getElementById('mainBoard').style.display = 'none';
                document.getElementById('setupScreen').style.display = 'flex';
                speakTTS("초기화");
            }
        }

        function swapCourt() {
            if(state.scoreLeft === 0 && state.scoreRight === 0) return;
            historyStack.push(JSON.parse(JSON.stringify(state)));
            let tempScore = state.scoreLeft; state.scoreLeft = state.scoreRight; state.scoreRight = tempScore;
            let tempTeam = state.leftTeam; state.leftTeam = state.rightTeam; state.rightTeam = tempTeam;
            state.servingTeam = state.servingTeam === 'left' ? 'right' : 'left';
            updateUI(); speakTTS("코트 변경");
            document.getElementById('mainBoard').scrollTo(0, 0);
        }

        function addScore(team) {
            if (!isSystemStarted) return;
            if(document.getElementById('mainBoard').scrollTop > 10) { document.getElementById('mainBoard').scrollTo(0, 0); return; }

            historyStack.push(JSON.parse(JSON.stringify(state)));
            let scoringTeamData = team === 'left' ? state.leftTeam : state.rightTeam;

            if (team === 'left') {
                state.scoreLeft++;
                if (state.servingTeam === 'left') { state.isContinuous = true; let temp = scoringTeamData.right; scoringTeamData.right = scoringTeamData.left; scoringTeamData.left = temp; } 
                else { state.isContinuous = false; state.servingTeam = 'left'; }
            } else {
                state.scoreRight++;
                if (state.servingTeam === 'right') { state.isContinuous = true; let temp = scoringTeamData.right; scoringTeamData.right = scoringTeamData.left; scoringTeamData.left = temp; } 
                else { state.isContinuous = false; state.servingTeam = 'right'; }
            }

            let serveScore = state.servingTeam === 'left' ? state.scoreLeft : state.scoreRight;
            state.currentServerSide = serveScore % 2 === 0 ? 'right' : 'left';
            let currentServeTeamData = state.servingTeam === 'left' ? state.leftTeam : state.rightTeam;
            state.currentServerName = state.currentServerSide === 'right' ? currentServeTeamData.right : currentServeTeamData.left;

            updateUI(); speakStatus();
        }

        function undoScore() {
            if (historyStack.length > 0) { 
                state = historyStack.pop(); updateUI(); speakTTS("취소"); 
                document.getElementById('mainBoard').scrollTo(0, 0);
            }
        }

        function updateUI() {
            document.getElementById('scoreLeft').innerText = state.scoreLeft;
            document.getElementById('scoreRight').innerText = state.scoreRight;
            document.getElementById('areaLeft').classList.remove('has-serve');
            document.getElementById('areaRight').classList.remove('has-serve');
            
            if (state.servingTeam === 'left') document.getElementById('areaLeft').classList.add('has-serve');
            else document.getElementById('areaRight').classList.add('has-serve');

            document.getElementById('name-left-top').innerText = state.leftTeam.left;
            document.getElementById('name-left-bottom').innerText = state.leftTeam.right;
            document.getElementById('name-right-top').innerText = state.rightTeam.right;
            document.getElementById('name-right-bottom').innerText = state.rightTeam.left;

            document.querySelectorAll('.mc-name').forEach(el => el.classList.remove('is-server'));
            
            const arrow = document.getElementById('shuttleArrow');
            arrow.className = 'shuttle-arrow'; 

            if (state.servingTeam === 'left') {
                if (state.currentServerSide === 'left') {
                    document.getElementById('name-left-top').classList.add('is-server');
                    arrow.classList.add('anim-lt-rb'); 
                } else {
                    document.getElementById('name-left-bottom').classList.add('is-server');
                    arrow.classList.add('anim-lb-rt'); 
                }
            } else {
                if (state.currentServerSide === 'right') {
                    document.getElementById('name-right-top').classList.add('is-server');
                    arrow.classList.add('anim-rt-lb'); 
                } else {
                    document.getElementById('name-right-bottom').classList.add('is-server');
                    arrow.classList.add('anim-rb-lt'); 
                }
            }
        }

        function speakStatus() {
            let serveScore = state.servingTeam === 'left' ? state.scoreLeft : state.scoreRight;
            let receiveScore = state.servingTeam === 'left' ? state.scoreRight : state.scoreLeft;
            let text = `${serveScore} 대 ${receiveScore}`;
            if (state.isContinuous) text += `, ${state.currentServerName} 연속`;
            else text = `${state.currentServerName} 서브, ` + text;
            speakTTS(text);
        }

        function speakTTS(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ko-KR'; utterance.rate = 1.15; 
                if (voices.length === 0) voices = window.speechSynthesis.getVoices();
                const koreanVoices = voices.filter(v => v.lang === 'ko-KR' || v.lang === 'ko_KR');
                if (koreanVoices.length > 0) utterance.voice = koreanVoices[0];
                window.speechSynthesis.speak(utterance);
            }
        }

        // ⌚ 갤럭시 워치 회전 베젤 (마우스 휠) 득점 조작 로직
        let bezelCooldown = false; 
        window.addEventListener('wheel', (e) => {
            if (!isSystemStarted || bezelCooldown) return;
            if(document.getElementById('mainBoard').scrollTop > 10) return;

            if (e.deltaY > 10) {
                addScore('right');
                if (navigator.vibrate) navigator.vibrate(50); 
                lockBezel();
            } 
            else if (e.deltaY < -10) {
                addScore('left');
                if (navigator.vibrate) navigator.vibrate(50); 
                lockBezel();
            }
        });

        function lockBezel() {
            bezelCooldown = true;
            setTimeout(() => { bezelCooldown = false; }, 600);
        }

        document.addEventListener("visibilitychange", async () => {
            if (document.visibilityState === "visible") {
                if ('speechSynthesis' in window) window.speechSynthesis.cancel();
                if (audioCtx && audioCtx.state === 'suspended') await audioCtx.resume();
                try { if (isSystemStarted && navigator.wakeLock) wakeLock = await navigator.wakeLock.request('screen'); } 
                catch (err) { console.log(err); }
            }
        });
    </script>
</body>
</html>
