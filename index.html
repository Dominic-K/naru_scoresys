<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>배드민턴 전광판</title>
    <style>
        /* 기본 설정 (터치 드래그 방지, 텍스트 선택 방지) */
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-drag: none; -webkit-tap-highlight-color: transparent; }
        body { 
            background-color: #0a0a0a; 
            color: #ffffff; 
            font-family: 'Pretendard', 'Arial', sans-serif; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            overflow: hidden; 
        }
        
        /* 상단 심플 컨트롤 패널 */
        .header {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            background-color: #111;
            border-bottom: 2px solid #222;
            gap: 20px;
            z-index: 10;
        }
        button {
            background-color: #333; color: #fff; border: none;
            padding: 15px 30px; font-size: 1.2rem; border-radius: 8px;
            cursor: pointer; font-weight: bold; transition: 0.2s;
        }
        button:active { transform: scale(0.95); }
        .btn-serve { background-color: #29b6f6; color: #000; }
        .btn-start { background-color: #00e676; color: #000; }
        .btn-undo { background-color: #ff5252; color: #fff; }

        /* 점수판 영역 */
        .scoreboard {
            display: flex;
            flex: 1;
            width: 100%;
        }
        
        /* 거대한 터치 버튼 역할 및 서브권 배경 표시 */
        .team {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            background-color: #0a0a0a; /* 기본 검은 배경 */
            transition: background-color 0.3s ease;
        }
        .team-left { border-right: 2px solid #222; }
        
        /* 💡 서브권이 있는 진영의 배경색 (눈에 띄는 네이비 톤) */
        .team.has-serve { background-color: #1a365d; }
        
        /* 터치 시 피드백 */
        .team:active { opacity: 0.8; }
        
        /* 점수 텍스트 (화면 꽉 차게) */
        .score {
            font-size: 50vw; 
            font-weight: 900; 
            line-height: 1;
            pointer-events: none; /* 글자 터치 오작동 방지 */
        }
        .team-left .score { color: #00ff00; } /* 형광 녹색 */
        .team-right .score { color: #ffff00; } /* 쨍한 노란색 */
    </style>
</head>
<body>

    <div class="header">
        <button class="btn-serve" id="firstServeBtn" onclick="toggleFirstServe()">선공</button>
        <button class="btn-start" id="startBtn">시작</button>
        <button class="btn-undo" id="undoBtn">실행취소</button>
    </div>

    <div class="scoreboard">
        <!-- 왼쪽 화면 -->
        <div class="team team-left has-serve" id="areaLeft" onclick="addScore('left')">
            <div class="score" id="scoreLeft">0</div>
        </div>

        <!-- 오른쪽 화면 -->
        <div class="team team-right" id="areaRight" onclick="addScore('right')">
            <div class="score" id="scoreRight">0</div>
        </div>
    </div>

    <!-- 백그라운드 미디어 제어 유지용 무음 오디오 -->
    <audio id="silentAudio" loop>
        <source src="data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA" type="audio/wav">
    </audio>

    <script>
        let state = { scoreLeft: 0, scoreRight: 0, servingTeam: 'left', isContinuous: false };
        let historyStack = [];
        let wakeLock = null;
        let isSystemStarted = false;
        let voices = [];

        // 기기의 TTS 목소리 목록 미리 스캔
        window.speechSynthesis.onvoiceschanged = () => {
            voices = window.speechSynthesis.getVoices();
        };

        function toggleFirstServe() {
            if(state.scoreLeft > 0 || state.scoreRight > 0) return; // 게임 시작 후 변경 불가
            state.servingTeam = state.servingTeam === 'left' ? 'right' : 'left';
            updateUI();
        }

        function addScore(team) {
            if (!isSystemStarted) {
                alert("'시작' 버튼을 먼저 눌러주세요!");
                return;
            }
            
            historyStack.push(JSON.parse(JSON.stringify(state)));

            if (team === 'left') {
                state.scoreLeft++;
                if (state.servingTeam === 'left') state.isContinuous = true;
                else { state.isContinuous = false; state.servingTeam = 'left'; }
            } else {
                state.scoreRight++;
                if (state.servingTeam === 'right') state.isContinuous = true;
                else { state.isContinuous = false; state.servingTeam = 'right'; }
            }

            updateUI();
            speakStatus();
        }

        function undoScore() {
            if (historyStack.length > 0) {
                state = historyStack.pop();
                updateUI();
                speakTTS("취소");
            }
        }

        function updateUI() {
            // 점수 업데이트
            document.getElementById('scoreLeft').innerText = state.scoreLeft;
            document.getElementById('scoreRight').innerText = state.scoreRight;

            // 배경색(서브권) 업데이트
            document.getElementById('areaLeft').classList.remove('has-serve');
            document.getElementById('areaRight').classList.remove('has-serve');
            
            if (state.servingTeam === 'left') {
                document.getElementById('areaLeft').classList.add('has-serve');
            } else {
                document.getElementById('areaRight').classList.add('has-serve');
            }
        }

        function speakStatus() {
            // "3 대 3" 직관적 음성 안내
            let text = `${state.scoreLeft} 대 ${state.scoreRight}. `;

            // 서브 위치 판별
            let serveScore = state.servingTeam === 'left' ? state.scoreLeft : state.scoreRight;
            text += ` ${serveScore % 2 === 0 ? "오른쪽" : "왼쪽"} 서브`;
            
            // 연속 여부
            if (state.isContinuous) text += " 연속";

            speakTTS(text);
        }

        function speakTTS(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ko-KR';
                utterance.rate = 1.15; // 스포츠용 빠른 속도

                // 고품질 음성 엔진(구글/애플) 최우선 할당
                if (voices.length === 0) voices = window.speechSynthesis.getVoices();
                const koreanVoices = voices.filter(v => v.lang === 'ko-KR' || v.lang === 'ko_KR');
                
                if (koreanVoices.length > 0) {
                    let selectedVoice = koreanVoices.find(v => v.name.includes('Google') || v.name.includes('구글')) 
                                     || koreanVoices.find(v => v.name.includes('Siri') || v.name.includes('Yuna') || v.name.includes('Apple'))
                                     || koreanVoices[0];
                    utterance.voice = selectedVoice;
                }

                window.speechSynthesis.speak(utterance);
            }
        }

        // 시스템 시작 (이어폰/TTS 권한 획득)
        document.getElementById('startBtn').addEventListener('click', async () => {
            isSystemStarted = true;
            const audio = document.getElementById('silentAudio');
            audio.play().catch(e => console.log(e));
            
            speakTTS("시작");

            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({ title: '배드민턴 전광판' });
                navigator.mediaSession.setActionHandler('nexttrack', () => { addScore('right'); });
                navigator.mediaSession.setActionHandler('previoustrack', () => { addScore('left'); });
                navigator.mediaSession.setActionHandler('pause', () => { undoScore(); audio.play(); });
            }

            try { wakeLock = await navigator.wakeLock.request('screen'); } catch (err) {}
            
            document.getElementById('startBtn').style.backgroundColor = "#555";
            document.getElementById('startBtn').style.color = "#fff";
        });

        // 버튼 및 키보드 이벤트 연동
        document.getElementById('undoBtn').addEventListener('click', undoScore);

        window.addEventListener('keydown', (e) => {
            if (!isSystemStarted) return; 
            switch(e.key) {
                case 'ArrowLeft': case 'a': case 'A': addScore('left'); break;
                case 'ArrowRight': case 'd': case 'D': addScore('right'); break;
                case 'Backspace': case 'z': case 'Z': undoScore(); break;
            }
        });

        // 초기 세팅
        updateUI();
    </script>
</body>
</html>
