<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>배드민턴 전광판 Pro</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-drag: none; -webkit-tap-highlight-color: transparent; }
        body { 
            background-color: #000; 
            color: #fff; 
            font-family: 'Pretendard', 'Arial', sans-serif; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            overflow: hidden; 
        }
        
        /* 상단 컨트롤 패널 */
        .header {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            background-color: #111;
            border-bottom: 2px solid #222;
            gap: 10px;
            flex-wrap: wrap;
            z-index: 10;
        }
        button {
            background-color: #333; color: #fff; border: none;
            padding: 12px 20px; font-size: 1.1rem; border-radius: 8px;
            cursor: pointer; font-weight: bold; transition: 0.2s;
        }
        button:active { transform: scale(0.95); }
        .btn-serve { background-color: #29b6f6; color: #000; }
        .btn-change { background-color: #ffa726; color: #000; }
        .btn-start { background-color: #00e676; color: #000; }
        .btn-undo { background-color: #ff5252; color: #fff; }

        /* 점수판 영역 */
        .scoreboard {
            display: flex;
            flex: 1;
            width: 100%;
        }
        
        .team {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            background-color: #000; 
            transition: background-color 0.2s ease;
        }
        .team-left { border-right: 2px solid #222; }
        
        /* 서브권이 있는 진영의 배경색 */
        .team.has-serve { background-color: #1a365d; }
        
        /* 터치 시 피드백 */
        .team:active { opacity: 0.7; }
        
        /* 화면 잘림 방지 (vmin 단위 사용) */
        .score {
            font-size: 35vmin; 
            font-weight: 900; 
            line-height: 1;
            pointer-events: none; 
        }
        .team-left .score { color: #00ff00; } 
        .team-right .score { color: #ffff00; } 
    </style>
</head>
<body>

    <div class="header">
        <button class="btn-serve" id="firstServeBtn" onclick="toggleFirstServe()">선공</button>
        <button class="btn-change" onclick="swapCourt()">코트변경</button>
        <button class="btn-start" id="startBtn">시작</button>
        <button class="btn-undo" onclick="undoScore()">실행취소</button>
    </div>

    <div class="scoreboard">
        <div class="team team-left has-serve" id="areaLeft" onclick="addScore('left')">
            <div class="score" id="scoreLeft">0</div>
        </div>
        <div class="team team-right" id="areaRight" onclick="addScore('right')">
            <div class="score" id="scoreRight">0</div>
        </div>
    </div>

    <!-- 백그라운드 세션용 무음 오디오 -->
    <audio id="silentAudio" loop playsinline>
        <source src="data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA" type="audio/wav">
    </audio>

    <script>
        let state = { scoreLeft: 0, scoreRight: 0, servingTeam: 'left', isContinuous: false };
        let historyStack = [];
        let wakeLock = null;
        let isSystemStarted = false;
        let audioCtx;
        let voices = [];

        window.speechSynthesis.onvoiceschanged = () => { voices = window.speechSynthesis.getVoices(); };

        function toggleFirstServe() {
            if(state.scoreLeft > 0 || state.scoreRight > 0) return;
            state.servingTeam = state.servingTeam === 'left' ? 'right' : 'left';
            updateUI();
        }

        function swapCourt() {
            if(state.scoreLeft === 0 && state.scoreRight === 0) return;
            historyStack.push(JSON.parse(JSON.stringify(state)));
            
            // 점수 및 서브권 좌/우 교체
            let tempScore = state.scoreLeft;
            state.scoreLeft = state.scoreRight;
            state.scoreRight = tempScore;
            state.servingTeam = state.servingTeam === 'left' ? 'right' : 'left';
            
            updateUI();
            speakTTS("코트 변경");
        }

        function addScore(team) {
            if (!isSystemStarted) { alert("'시작' 버튼을 먼저 눌러주세요!"); return; }
            historyStack.push(JSON.parse(JSON.stringify(state)));

            if (team === 'left') {
                state.scoreLeft++;
                if (state.servingTeam === 'left') state.isContinuous = true;
                else { state.isContinuous = false; state.servingTeam = 'left'; }
            } else {
                state.scoreRight++;
                if (state.servingTeam === 'right') state.isContinuous = true;
                else { state.isContinuous = false; state.servingTeam = 'right'; }
            }

            updateUI();
            speakStatus();
        }

        function undoScore() {
            if (historyStack.length > 0) {
                state = historyStack.pop();
                updateUI();
                speakTTS("취소");
            }
        }

        function updateUI() {
            document.getElementById('scoreLeft').innerText = state.scoreLeft;
            document.getElementById('scoreRight').innerText = state.scoreRight;
            
            document.getElementById('areaLeft').classList.remove('has-serve');
            document.getElementById('areaRight').classList.remove('has-serve');
            if (state.servingTeam === 'left') document.getElementById('areaLeft').classList.add('has-serve');
            else document.getElementById('areaRight').classList.add('has-serve');
        }

        function speakStatus() {
            // 서브하는 쪽 점수를 무조건 먼저 읽기
            let serveScore = state.servingTeam === 'left' ? state.scoreLeft : state.scoreRight;
            let receiveScore = state.servingTeam === 'left' ? state.scoreRight : state.scoreLeft;
            
            let text = "";
            if (serveScore === receiveScore) text = `${serveScore} 대 ${receiveScore}`;
            else text = `${serveScore} 대 ${receiveScore}`;
            
            if (state.isContinuous) text += " 연속";
            
            speakTTS(text);
        }

        function speakTTS(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ko-KR';
                utterance.rate = 1.15; 
                
                if (voices.length === 0) voices = window.speechSynthesis.getVoices();
                const koreanVoices = voices.filter(v => v.lang === 'ko-KR' || v.lang === 'ko_KR');
                if (koreanVoices.length > 0) {
                    let selectedVoice = koreanVoices.find(v => v.name.includes('Google') || v.name.includes('구글')) 
                                     || koreanVoices.find(v => v.name.includes('Siri') || v.name.includes('Yuna') || v.name.includes('Apple'))
                                     || koreanVoices[0];
                    utterance.voice = selectedVoice;
                }
                window.speechSynthesis.speak(utterance);
            }
        }

        // 안드로이드/iOS 미디어 권한 강제 탈취 로직
        document.getElementById('startBtn').addEventListener('click', async () => {
            const btn = document.getElementById('startBtn');
            btn.style.backgroundColor = "#555";
            btn.style.color = "#fff";
            btn.innerText = "작동중";
            isSystemStarted = true;

            try {
                const audio = document.getElementById('silentAudio');
                audio.play().catch(e => console.log(e));

                // 사람 귀에 안 들리는 미세 주파수로 오디오 세션 강제 유지
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!audioCtx) audioCtx = new AudioContext();
                if (audioCtx.state === 'suspended') await audioCtx.resume();
                
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                gainNode.gain.value = 0.0001; // 극도로 낮은 볼륨
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                oscillator.start();

                if ('mediaSession' in navigator) {
                    navigator.mediaSession.metadata = new MediaMetadata({ title: '배드민턴 전광판 Pro' });
                    navigator.mediaSession.playbackState = "playing"; // 재생 중임을 OS에 강제 알림
                    
                    navigator.mediaSession.setActionHandler('nexttrack', () => { addScore('right'); });
                    navigator.mediaSession.setActionHandler('previoustrack', () => { addScore('left'); });
                    navigator.mediaSession.setActionHandler('pause', () => { undoScore(); });
                    navigator.mediaSession.setActionHandler('play', () => { audio.play(); });
                }

                speakTTS("시작");
                wakeLock = await navigator.wakeLock.request('screen');
            } catch (err) {
                console.log("권한 제한됨:", err);
            }
        });

        // PC 키보드 연동
        window.addEventListener('keydown', (e) => {
            if (!isSystemStarted) return; 
            switch(e.key) {
                case 'ArrowLeft': case 'a': addScore('left'); break;
                case 'ArrowRight': case 'd': addScore('right'); break;
                case 'Backspace': case 'z': undoScore(); break;
            }
        });

        updateUI();
    </script>
</body>
</html>
